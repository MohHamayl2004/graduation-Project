<body><div id="root"></div><script type="module">
import React from 'react';

import '@fontsource/tajawal/700.css';

window.bookAttempts = [];
window.bookReads = [];
window.bookEngines = [];

createRoot(document.getElementById('root')).render(h(React.StrictMode, null,
  h(AuthProvider, null,
    h(MemoryRouter, {initialEntries:['/lesson/1-1']},
      h('div', {className:'app-screen living-screen', dir:'rtl'},
        h(Sidebar, {activeItem:'lectures'}),
        h('div', {className:'living-workspace'},
          h('header', {className:'living-header'}, h('a', {href:'#library'},'مكتبة الرياضيات'), h('div', null,h('span',{className:'living-wordmark'},'نِبراس'),h('h1',null,'متوسط التغير ١–١')),h('a',{href:'#pdf'},'الكتاب الأصلي')),
          h('main',null,h('p',{className:'living-edition'},'الرياضيات · الوحدة الأولى',h('span',null,'نسخة تفاعلية من صفحات الكتاب ٤–٨')),
            h(BookStage,{book:lessonBooks[0],start:0,completed:false,onRead:id=>window.bookReads.push(id),onAttempt:answer=>window.bookAttempts.push(answer),onAsk:()=>{}}),
            h('div',{className:'living-save'},'يُحفظ موضع القراءة وإنجاز المثال في حسابك.'))))))));
